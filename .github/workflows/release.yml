name: Stable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: false
        default: 'v1.3.1'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    uses: ./.github/workflows/ci.yml

  publish:
    if: always() && !cancelled()
    needs: compatibility
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Determine tag name
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            echo "TAG_NAME=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Verify stable release metadata
        shell: bash
        run: |
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          php -r '$plugin = new stdClass(); define("MOODLE_INTERNAL", true); define("MATURITY_STABLE", 200); require "version.php"; if ($plugin->component !== "local_clonecategory" || $plugin->release !== substr(getenv("TAG_NAME"), 1) || $plugin->maturity !== MATURITY_STABLE) { fwrite(STDERR, "Stable version metadata does not match the release tag.\n"); exit(1); }'

      - name: Build Moodle installation archives
        shell: bash
        run: |
          release_version="${TAG_NAME#v}"
          git archive --format=zip --prefix=clonecategory/ --output="local_clonecategory-${release_version}.zip" HEAD
          git archive --format=tar --prefix=clonecategory/ HEAD | gzip -n > "local_clonecategory-${release_version}.tar.gz"
          sha256sum "local_clonecategory-${release_version}.zip" "local_clonecategory-${release_version}.tar.gz" > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${TAG_NAME#v}"
          assets=(
            "local_clonecategory-${release_version}.zip"
            "local_clonecategory-${release_version}.tar.gz"
            checksums.txt
          )
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
            gh release edit "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag --title "Release $TAG_NAME" \
              --notes-file RELEASE_NOTES.md --latest
          fi
